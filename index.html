<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thread Vault</title>
<meta name="description" content="Thread Vault: koleksi kisah benar gaya Threads, sedia salin.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07152B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFCE32;--yellow-dk:#E6B600;--yellow-lt:#FFF8D6;--bg:#FFFCF0;--navy:#07152B;--navy-2:#1E3050;--blue:#3A74CC;--muted:#5A6D82;--border:#EDE8D5;--card:#fff;--ok:#1E8E5A;
--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0B1424;--card:#111D33;--navy:#EAF0FA;--navy-2:#C5D0E4;--muted:#93A3BC;--border:#22314D;--yellow-lt:#2A2408}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--sans);line-height:1.55}
img{height:auto}
header{background:#07152B;color:#fff;padding:22px 16px 18px}
.wrap{max-width:760px;margin:0 auto}
header h1{font-family:var(--serif);font-size:30px;margin:0 0 4px;color:var(--yellow)}
header p{margin:0;color:#C5D0E4;font-size:14px}
.bar{z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 16px}
@media (min-width:700px){.bar{position:sticky;top:0}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--border);background:var(--card);color:var(--navy);border-radius:999px;padding:6px 14px;font:600 13px var(--sans);cursor:pointer}
.tab[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow-dk);color:#07152B}
#q{width:100%;border:1px solid var(--border);background:var(--card);color:var(--navy);border-radius:12px;padding:11px 14px;font:16px var(--sans)}
#q:focus{outline:2px solid var(--yellow-dk);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--border);background:var(--card);color:var(--navy);border-radius:999px;padding:5px 12px;font:500 12.5px var(--sans);cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
main{padding:16px}
.hari{background:var(--yellow-lt);border:1px solid var(--yellow-dk);border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.hari small{display:block;color:var(--muted);font-size:12px}
.hari b{font-size:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.card.done{opacity:.62}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.badge{background:var(--yellow);color:#07152B;border-radius:999px;padding:2px 10px;font-weight:600}
.card h2{font-family:var(--serif);font-size:20px;line-height:1.3;margin:0 0 2px}
.lok{font-size:13px;color:var(--muted);margin:0 0 12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
.box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.lipat{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
.more{background:none;border:0;color:var(--blue);font:600 13px var(--sans);padding:6px 0 0;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--navy);border-radius:10px;padding:9px 14px;font:600 13px var(--sans);cursor:pointer;text-decoration:none;display:inline-block}
.btn{max-width:100%;overflow-wrap:anywhere;text-align:left}
.btn.pri{background:var(--yellow);border-color:var(--yellow-dk);color:#07152B}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.seg{margin-top:8px}
.seg .h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
.seg .h.long{color:#C0392B}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.count{font-size:13px;color:var(--muted);margin:0 0 12px}
footer{padding:24px 16px 40px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Thread Vault</h1>
  <p>Kisah benar gaya Threads. Pilih, salin, post.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="tabs" id="tabs" role="group" aria-label="Siri"></div>
  <input id="q" type="search" placeholder="Cari nama, negara, tema, isi cerita..." autocomplete="off" aria-label="Cari">
  <div class="chips" id="chips" role="group" aria-label="Tema"></div>
  <div class="opts">
    <label><input type="radio" name="st" value="all" checked> Semua</label>
    <label><input type="radio" name="st" value="belum"> Belum post</label>
    <label><input type="radio" name="st" value="dah"> Dah post</label>
    <span id="kira"></span>
  </div>
</div></div>

<main><div class="wrap">
  <div id="hari"></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>Tiada kisah padan. Cuba kata kunci lain.</div>
  <div class="row" style="justify-content:center"><button class="btn" id="lagi" hidden>Tunjuk lagi</button></div>
</div></main>
<footer>Thread Vault · Kisah benar berdasarkan laporan berita rasmi, pautan sumber disertakan pada setiap kisah.</footer>

<script src="data/index.js"></script>
<script>
(function(){
'use strict';
var SI=window.SIRI||{utama:[],arsip:[]}, TABS=SI.utama, S=window.STORIES=window.STORIES||[], PAGE=30, LIMIT=500, LOADED={};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var st={tab:ld('tab',TABS[0]||'Archive'),q:'',tema:'Semua',status:'all',n:PAGE,dah:ld('dahPost',{}),open:{},pecah:{}};
if(tabList().indexOf(st.tab)<0)st.tab=TABS[0]||'Archive';
var $=function(id){return document.getElementById(id)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function teksPenuh(s){return s.hook+'\n\n'+s.body.join('\n\n')}
function pecah(s){ // kumpul perenggan hingga <=LIMIT aksara setiap post
  var par=[s.hook].concat(s.body),out=[],cur='';
  par.forEach(function(p){
    if(!cur){cur=p}
    else if((cur+'\n\n'+p).length<=LIMIT){cur+='\n\n'+p}
    else{out.push(cur);cur=p}
  });
  if(cur)out.push(cur);
  return out;
}
function salin(t,btn,lbl){
  function ok(){var o=btn.textContent;btn.textContent='✓ Disalin';btn.classList.add('ok');setTimeout(function(){btn.textContent=lbl||o;btn.classList.remove('ok')},1400)}
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb();
}
function norm(x){return (x||'').toLowerCase()}
function hay(s){return norm([s.siri,'kisah '+s.no,s.nama,s.tajuk,s.lokasi,s.tahun,s.tema,s.subtema,s.gambar,s.sumber,s.hook,s.body.join(' ')].join(' '))}

function tabList(){return SI.arsip.length?TABS.concat('Archive'):TABS}
function inTab(s){return st.tab==='Archive'?SI.arsip.indexOf(s.siri)>=0:s.siri===st.tab}
function muat(nama){
  if(LOADED[nama])return LOADED[nama];
  LOADED[nama]=new Promise(function(ok,gagal){
    var e=document.createElement('script');e.src='data/'+nama+'.js';e.onload=ok;e.onerror=function(){delete LOADED[nama];gagal(new Error(nama))};document.head.appendChild(e)});
  return LOADED[nama];
}
function pergi(){
  var perlu=st.tab==='Archive'?SI.arsip:[st.tab];
  $('count').textContent='Memuatkan...';
  Promise.all(perlu.map(muat)).then(render,function(){$('count').textContent='Gagal memuatkan data. Cuba refresh.'});
}
function filtered(){
  var ws=norm(st.q).split(/\s+/).filter(Boolean);
  return S.filter(function(s){
    if(!inTab(s))return false;
    if(st.tema!=='Semua'&&s.tema!==st.tema)return false;
    if(st.status==='belum'&&st.dah[s.id])return false;
    if(st.status==='dah'&&!st.dah[s.id])return false;
    if(!s._h)s._h=hay(s);
    return ws.every(function(w){return s._h.indexOf(w)>=0});
  });
}
function renderTabs(){
  var t=$('tabs');t.textContent='';
  tabList().forEach(function(n){
    var b=el('button','tab',n.replace('KisahBenar-','Set '));b.type='button';b.setAttribute('aria-pressed',n===st.tab);
    b.onclick=function(){st.tab=n;st.tema='Semua';st.n=PAGE;sv('tab',n);renderTabs();pergi()};
    t.appendChild(b);
  });
}
function renderChips(){
  var c=$('chips');c.textContent='';
  var tabS=S.filter(inTab),set={};
  tabS.forEach(function(s){set[s.tema]=1});
  ['Semua'].concat(Object.keys(set)).forEach(function(n){
    var b=el('button','chip',n);b.type='button';b.setAttribute('aria-pressed',n===st.tema);
    b.onclick=function(){st.tema=n;st.q='';$('q').value='';st.n=PAGE;render()};
    c.appendChild(b);
  });
}
function renderHari(list){
  var h=$('hari');h.textContent='';
  var pool=S.filter(inTab).filter(function(s){return !st.dah[s.id]});
  if(!pool.length)return;
  var d=new Date(),k=d.getFullYear()*372+d.getMonth()*31+d.getDate();
  var s=pool[k%pool.length];
  var box=el('div','hari'),l=el('div');
  var sm=el('small',null,'Cadangan hari ni');l.appendChild(sm);l.appendChild(el('b',null,'Kisah '+String(s.no).padStart(2,'0')+' · '+s.nama));
  var b=el('button','btn pri','Buka');b.type='button';
  b.onclick=function(){st.q=s.nama;$('q').value=s.nama;st.tema='Semua';st.status='all';document.querySelector('input[name=st][value=all]').checked=true;st.n=PAGE;render();window.scrollTo(0,0)};
  box.appendChild(l);box.appendChild(b);h.appendChild(box);
}
function card(s){
  var c=el('article','card'+(st.dah[s.id]?' done':''));
  var m=el('div','meta');
  m.appendChild(el('span',null,s.siri+' · '+String(s.no).padStart(2,'0')));
  m.appendChild(el('span','badge',s.tema));
  c.appendChild(m);
  c.appendChild(el('h2',null,s.tajuk));
  var lk=[s.lokasi?(s.lokasi+(s.tahun?' ('+s.tahun+')':'')):s.tahun,s.subtema].filter(Boolean).join(' · ');
  if(lk)c.appendChild(el('p','lok',lk));

  var full=teksPenuh(s);
  c.appendChild(el('div','lbl','Thread penuh · '+full.length.toLocaleString('en-US')+' aksara'));
  var box=el('div','box lipat',full);
  c.appendChild(box);
  var more=el('button','more',st.open[s.id]?'▲ Tutup':'▼ Lihat lagi');more.type='button';
  more.onclick=function(){st.open[s.id]=!st.open[s.id];box.classList.toggle('lipat',!st.open[s.id]);more.textContent=st.open[s.id]?'▲ Tutup':'▼ Lihat lagi'};
  if(st.open[s.id])box.classList.remove('lipat');
  c.appendChild(more);

  var r=el('div','row');
  var b1=el('button','btn pri','📋 Copy Thread');b1.type='button';b1.onclick=function(){salin(full,b1,'📋 Copy Thread')};
  var b2=el('button','btn','📋 Copy Hook');b2.type='button';b2.onclick=function(){salin(s.hook,b2,'📋 Copy Hook')};
  var b3=el('button','btn','🧵 Pecah ikut '+LIMIT+' aksara');b3.type='button';
  var b4=el('a','btn','🔗 Sumber: '+s.sumber);b4.href=s.link;b4.target='_blank';b4.rel='noopener noreferrer';
  var b5=el('button','btn',st.dah[s.id]?'✓ Dah post':'Tanda dah post');b5.type='button';
  b5.onclick=function(){if(st.dah[s.id])delete st.dah[s.id];else st.dah[s.id]=1;sv('dahPost',st.dah);render()};
  r.appendChild(b1);r.appendChild(b2);r.appendChild(b3);r.appendChild(b5);c.appendChild(r);
  var r2=el('div','row');r2.appendChild(b4);c.appendChild(r2);
  if(s.gambar){
    c.appendChild(el('div','lbl','Kata kunci cari gambar'));
    var gb=el('div','box',s.gambar);c.appendChild(gb);
    var gr=el('div','row');var gc=el('button','btn','📋 Copy Kata Kunci');gc.type='button';gc.onclick=function(){salin(s.gambar,gc,'📋 Copy Kata Kunci')};
    gr.appendChild(gc);c.appendChild(gr);
  }

  var segs=el('div');c.appendChild(segs);
  function drawSegs(){
    segs.textContent='';
    if(!st.pecah[s.id])return;
    var p=pecah(s);
    segs.appendChild(el('div','lbl','Siri thread: '+p.length+' post'));
    p.forEach(function(t,i){
      var w=el('div','seg'),h=el('div','h'+(t.length>LIMIT?' long':''));
      h.appendChild(el('span',null,'Post '+(i+1)+'/'+p.length+' · '+t.length+' aksara'+(t.length>LIMIT?' (lebih had)':'')));
      var cb=el('button','btn','📋 Copy');cb.type='button';cb.onclick=function(){salin(t,cb,'📋 Copy')};
      h.appendChild(cb);w.appendChild(h);w.appendChild(el('div','box',t));segs.appendChild(w);
    });
  }
  b3.onclick=function(){st.pecah[s.id]=!st.pecah[s.id];b3.textContent=st.pecah[s.id]?'Tutup pecahan':'🧵 Pecah ikut '+LIMIT+' aksara';drawSegs()};
  if(st.pecah[s.id]){b3.textContent='Tutup pecahan';drawSegs()}
  return c;
}
function render(){
  renderTabs();renderChips();
  var list=filtered(),tabS=S.filter(inTab),dah=tabS.filter(function(s){return st.dah[s.id]}).length;
  $('kira').textContent=dah+' / '+tabS.length+' dah post';
  renderHari();
  $('count').textContent=list.length+' kisah';
  var L=$('list');L.textContent='';
  list.slice(0,st.n).forEach(function(s){L.appendChild(card(s))});
  $('empty').hidden=list.length>0;
  $('lagi').hidden=list.length<=st.n;
}
var tm;$('q').addEventListener('input',function(e){clearTimeout(tm);tm=setTimeout(function(){st.q=e.target.value;if(st.q)st.tema='Semua';st.n=PAGE;render()},120)});
Array.prototype.forEach.call(document.querySelectorAll('input[name=st]'),function(r){r.onchange=function(){st.status=r.value;st.n=PAGE;render()}});
$('lagi').onclick=function(){st.n+=PAGE;render()};
pergi();
})();
</script>
</body>
</html>
